[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "construction-ai-foundation"
version = "0.1.0"
description = "Clean Foundation & Domain-Driven Base for Construction AI Copilot"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    { name = "Construction AI Team" }
]
dependencies = [
    "pydantic>=2.0.0",
    "langgraph>=0.2.0",
    "langchain-core>=0.3.0",
    "langchain-ollama>=0.2.0",
    "langchain-openai",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-cov>=4.1.0",
    "black>=24.0.0",
    "ruff>=0.3.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py", "*_example.py"]

[tool.pyright]
extraPaths = [".", "src"]

